<svg xmlns="http://www.w3.org/2000/svg" width="900" height="210" viewBox="0 0 900 210" role="img" aria-label="Ablauf: Lehrkraft, KI-Assistent, Drehbuch, Generator, Kurssicherung, Lernplattform">
  <rect width="900" height="210" rx="14" fill="#f3e9d8"/>
  <g font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" text-anchor="middle" fill="#2a2a2a">
    <g transform="translate(90,80)"><rect x="-60" y="-40" width="120" height="80" rx="10" fill="#ffffff" stroke="#2a2a2a" stroke-opacity="0.35"/><text y="-6" font-size="15" font-weight="600">Lehrkraft</text><text y="16" font-size="12" fill="#6b6257">Beschreibung,</text><text y="32" font-size="12" fill="#6b6257">eigenes Material</text></g>
    <path d="M152 80 h34" stroke="#d9a441" stroke-width="3"/><path d="M182 73 l10 7 -10 7" fill="#d9a441"/>
    <g transform="translate(260,80)"><rect x="-60" y="-40" width="120" height="80" rx="10" fill="#ffffff" stroke="#2a2a2a" stroke-opacity="0.35"/><text y="-6" font-size="15" font-weight="600">KI-Assistent</text><text y="16" font-size="12" fill="#6b6257">liest SKILL.md,</text><text y="32" font-size="12" fill="#6b6257">stellt wenige Fragen</text></g>
    <path d="M322 80 h34" stroke="#d9a441" stroke-width="3"/><path d="M352 73 l10 7 -10 7" fill="#d9a441"/>
    <g transform="translate(430,80)"><rect x="-60" y="-40" width="120" height="80" rx="10" fill="#ffffff" stroke="#d9a441" stroke-width="2"/><text y="-6" font-size="15" font-weight="600">Drehbuch</text><text y="16" font-size="12" fill="#6b6257">= Kursdatei, Text</text><text y="32" font-size="12" fill="#6b6257">zum Gegenlesen</text></g>
    <path d="M492 80 h34" stroke="#d9a441" stroke-width="3"/><path d="M522 73 l10 7 -10 7" fill="#d9a441"/>
    <g transform="translate(600,80)"><rect x="-60" y="-40" width="120" height="80" rx="10" fill="#ffffff" stroke="#2a2a2a" stroke-opacity="0.35"/><text y="-6" font-size="15" font-weight="600">Generator</text><text y="16" font-size="12" fill="#6b6257">scripts/build.py</text><text y="32" font-size="12" fill="#6b6257">baut das Archiv</text></g>
    <path d="M662 80 h34" stroke="#d9a441" stroke-width="3"/><path d="M692 73 l10 7 -10 7" fill="#d9a441"/>
    <g transform="translate(790,80)"><rect x="-70" y="-40" width="140" height="80" rx="10" fill="#2a2a2a"/><text y="-6" font-size="15" font-weight="600" fill="#f3e9d8">Lernplattform</text><text y="16" font-size="12" fill="#f3e9d8" fill-opacity="0.75">Kurs wiederverwenden</text><text y="32" font-size="12" fill="#f3e9d8" fill-opacity="0.75">→ Wiederherstellen</text></g>
    <text x="450" y="170" font-size="13" fill="#6b6257">Freigabe des Drehbuchs durch die Lehrkraft, erst dann wird gebaut. Die .mbz ist nicht an einen Account gebunden.</text>
  </g>
