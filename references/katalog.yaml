# Katalog der Bausteintypen: die eine Quelle für Parser-Angaben, kursdatei.md, Formularnamen der Oberfläche, Prompt-
# Bausteine (AP11) und die Phasenschemata. `scripts/tests/test_katalog.py` prüft den Gleichstand mit `gen/kursdatei.py`
# (ELEMENTE, ATTRS) und mit `kursdatei.md` und baut jedes Beispiel.
# Felder je Typ: typ (Name in der Kursdatei), formularname (Begriff der Oberfläche), moodle (Ziel), angaben (erlaubte
# `schlüssel:`-Zeilen), pflicht (davon Pflichtangaben), assets (Dateien, die das Beispiel braucht), beispiel (Kursdatei-
# Auszug), regeln (Sätze, die im Prompt und in der Diagnose gelten), phasen (Phasen der Schemata, in denen der Typ
# vorkommt), kursdatei (Abschnitt der Referenz), rolle (einstieg, lesen, üben, sichern oder rahmen; für die Kennzahl
# „Folge Lesen → Üben → Sichern“ der Oberfläche, wenn der Baustein keine Phase aus einer Vorlage trägt), minuten (false:
# Strukturbaustein ohne Zeitbedarf; die Karte zeigt weder Phase noch Soll, die Kennzahlen zählen ihn nicht), mindest
# (AP13.1: Mindestmaß im Text für den Chat und in der Prüfung der Mühle; `zahl` und `einheit` (Fragen, Paare, Lücken,
# Karten, Wörter), `nur: Hefteintrag` = gilt nur für den Hefteintrag; Unterschreitung = roter Baustein mit Korrektursatz).
# Am Ende: `vorlagen` (Einheitsvorlagen aus docs/entwicklung/phasenschemata.md), `oberflaeche` (Auswahl der
# Kursangaben), `chats` (Chat-Auswahl), `prompt` (Sätze für den Text für den Chat, gen/prompt.py) und `zeitbedarf`
# (Ist-Minuten aus dem Inhalt, gen/mappe.py). scripts/web_bundle.py legt daraus web/katalog.json für die Browser-Fassung an.
format: 1
kopf:
  kurs:
    angaben: [farbe, kursbild]
    regeln:
      - "`farbe` ist die Akzentfarbe als #RRGGBB oder rot, grün, blau, orange, lila; Standard #1D5FD1."
      - "`kursbild` ist ein textfreies Bild aus assets/; fehlt es, dient das Banner-Bild."
  abschnitt:
    angaben: [teil, farbe, kachelbild, kachelicon, website, sichtbar ab, prototyp]
    regeln:
      - "Ein Abschnitt beginnt mit `## Titel · N min`; der erste Abschnitt heißt Allgemeines (optional)."
      - "`website: textfeld` setzt Übungen des Abschnitts als Blöcke ins Textfeld (Standard für formative Übungen in 2.0)."
gemeinsam:
  angaben: [sichtbar ab, prototyp, id]
  regeln:
    - "Jedes Element steht als `### Typ: Titel · N min` in einem Abschnitt, mit vier Rauten in einem Unterabschnitt."
    - "Angaben stehen direkt unter der Überschrift als `schlüssel: wert`, klein geschrieben, je Zeile eine."
    - "`id: b3` ist die Baustein-ID der Kursmappe; steht sie im Auftrag, bleibt sie unverändert in der Antwort."
    - "Titel sind im Kurs eindeutig; Zweck und Quelle stehen nur im Drehbuch, nie im Kursinhalt."
    - "Inline erlaubt: **fett**, *kursiv*, ==markiert==, HTML nur b, i, em, strong, br, sup, sub, mark; Adressen nur https."
typen:
  - typ: Banner
    formularname: Kursbanner
    rolle: rahmen
    minuten: false
    moodle: Textfeld (label) mit Bild
    angaben: [bild, untertitel, name, website]
    assets: [banner.png]
    kursdatei: "§3"
    phasen: [Allgemeines]
    beispiel: |
      ### Banner: Netzwerkkomponenten
      bild: banner.png
      untertitel: Wie kommt das Internet aufs Handy?
    regeln:
      - "Erstes Element in Allgemeines; das Bild ist textfrei (Titel und Satz legt der Generator darüber)."
  - typ: Textfeld
    formularname: Text
    rolle: lesen
    moodle: Textfeld (label)
    angaben: [website]
    kursdatei: "§3, §4"
    phasen: [Einstieg, Hinführung, Zielangabe, Überblick, Sicherung]
    mindest: {zahl: 80, einheit: Wörter, nur: Hefteintrag}
    beispiel: |
      ### Textfeld: Einstieg · 3 min
      Vorspann: Sonntagabend, das Handy zeigt 23 % und lädt nicht.
      Kasten: Denk kurz nach
        Was würdest du als Erstes prüfen?
      Merke: Erst beschreiben, dann suchen.
    regeln:
      - "Textbausteine: Absatz, Vorspann, Überschrift, Hervorhebung, Liste, Schritte, Tabelle, Kasten, Beispiel, Hinweis, Merke, Vergleich, Bild, Bildzeile."
      - "Kein Absatz länger als fünf Zeilen auf dem Handy (etwa 60 Wörter)."
  - typ: Seite
    formularname: Seite
    rolle: lesen
    moodle: Textseite (page)
    angaben: [abschluss, website]
    kursdatei: "§3, §4"
    phasen: [Erarbeitung, Kurz erinnern, Lesen, Sicherung, Sichern]
    mindest: {zahl: 80, einheit: Wörter, nur: Hefteintrag}
    beispiel: |
      ### Seite: Der Fall · 4 min
      Überschrift: Vier Fragen vor jeder Suche
      Mia weiß noch nicht, was ihr Problem ist. Solange sie es nicht beschreiben kann, bekommt sie Antworten auf fremde Fragen.
      Schritte: So beschreibst du ein Problem
      1. Welches Gerät genau?
      2. Was passiert, was nicht?
      Beispiel: Mias Problem-Satz
        Mein Handy lädt seit gestern nicht mehr, das Ladesymbol blinkt kurz.
    regeln:
      - "Eine Seite für längere Lesetexte mit Zwischenüberschriften; `abschluss` ansehen (Standard), bestehen, keine, manuell."
  - typ: Überblick
    formularname: Überblick
    rolle: rahmen
    minuten: false
    moodle: Textfeld (label) mit Kopfkarte
    angaben: [name, nummer, untertitel, dauer, website]
    kursdatei: "§3"
    phasen: [Allgemeines, Überblick]
    beispiel: |
      ### Überblick: Lerneinheit 1
      untertitel: Vom Kabel in der Wand bis zum Handy
      dauer: 20 min
      - Lesen: Was ein Heimnetz ist
      - Üben: Geräte zuordnen
      - Sichern: Hefteintrag und Quiz
    regeln:
      - "Nur eine Liste `- Schritt: Erklärung`; im Kachelformat entfällt ein Überblick in Allgemeines."
  - typ: Link
    formularname: Link
    rolle: lesen
    moodle: URL (url)
    angaben: [anzeige, abschluss, website]
    kursdatei: "§3"
    phasen: [Erarbeitung, Vertiefung]
    beispiel: |
      ### Link: Erklärseite zum Heimnetz
      anzeige: neues fenster
      https://www.example.org/heimnetz
    regeln:
      - "Eine Zeile mit der Adresse unter den Angaben; nur https. `anzeige` eingebettet (Standard), automatisch, neues fenster, popup."
  - typ: Video
    formularname: Video
    rolle: lesen
    moodle: URL (url), eingebettet
    angaben: [anzeige, abschluss, website]
    kursdatei: "§3"
    phasen: [Einstieg, Erarbeitung]
    beispiel: |
      ### Video: Erklärvideo Router · 4 min
      https://www.example.org/video/router
    regeln:
      - "Eine Zeile mit der Adresse; nur https. Im Website-Modus werden YouTube und Vimeo eingebettet, sonst ein Knopf."
  - typ: Lesebuch
    formularname: Lesebuch mit Fragen
    rolle: lesen
    moodle: H5P Interactive Book
    angaben: [farbe, abschluss, website]
    kursdatei: "§3, §5"
    phasen: [Erarbeitung, Erinnern, Lesen]
    beispiel: |
      ### Lesebuch: Netzwerkgrundlagen · 8 min
      Seite: Was ein Netz ist
      Ein Netz verbindet Geräte, damit sie Daten tauschen können.
      MC: Was verbindet ein Netz? · ✔Geräte · Steckdosen
      Seite: Kabel oder Funk
      Kabel sind schnell und stabil, Funk ist bequem.
      RF: Funk ist immer schneller als Kabel. ✘ → richtig: Kabel bleibt schneller. → falsch: Nein, Kabel ist schneller.
    regeln:
      - "Jede Seite beginnt mit `Seite: Titel`; darunter Textbausteine, `Bild:` und Fragen (MC, RF, Einsetzen, Markieren, Lückentext, Aussagen, Schnellquiz)."
  - typ: Quiz
    formularname: Quiz
    rolle: üben
    moodle: H5P Question Set
    angaben: [bestehen, einleitung, abschluss, website]
    kursdatei: "§3, §5"
    phasen: [Übung, Üben in Stufen, Üben nach Teilthemen, Sicherung, Sichern, Selbstkontrolle, Vertiefung]
    mindest: {zahl: 3, einheit: Fragen}
    beispiel: |
      ### Quiz: Zwischencheck · 5 min
      bestehen: 2 von 3
      1. Welches Gerät macht aus einem Anschluss viele? · ✔Switch · Router · Buchse
      2. RF: Der Router verbindet das Heimnetz mit dem Internet. ✔ → richtig: Genau. → falsch: Doch, das ist seine Aufgabe.
      3. Einsetzen: Ordne die Geräte dem Weg des Signals zu
      Wand: *Buchse* → *Router* → *Switch* → Endgerät
    regeln:
      - "Fragen als nummerierte Liste; eine Zeile mit ` · ` und ✔ ist automatisch MC; Rückmeldung je Antwort mit →."
      - "`bestehen` als `80 %` oder `5 von 6`; Standard 70 %. Ein Quiz im Textfeld-Modus braucht `abschluss: ansehen`."
  - typ: Zuordnen
    formularname: Zuordnen
    rolle: üben
    moodle: H5P Drag and Drop
    angaben: [zonen, spalten, breite, höhe, titel, hintergrund, abschluss, website]
    pflicht: [zonen]
    kursdatei: "§3"
    phasen: [Übung, Aufwärmen, Üben]
    mindest: {zahl: 4, einheit: Paare}
    beispiel: |
      ### Zuordnen: Kabel oder Funk · 4 min
      zonen: Kabel | Funk
      titel: Ein Gerät passt zu keiner Zone.
      - Switch → Kabel
      - Access Point → Funk
      - Netzwerkkabel → Kabel
      - Drucker
    regeln:
      - "`zonen: A | B | C` ist Pflicht; `- Element → Zone`; ein Element ohne Zone ist ein Ablenker, dann nennt `titel` das."
  - typ: Lernkarten
    formularname: Lernkarten
    rolle: üben
    moodle: H5P Dialog Cards
    angaben: [titel, beschreibung, modus, abschluss, website]
    kursdatei: "§3"
    phasen: [Aufwärmen, Üben, Vertiefung, Reflexion]
    mindest: {zahl: 4, einheit: Karten}
    beispiel: |
      ### Lernkarten: Netzbegriffe · 4 min
      - Router → Verbindet das Heimnetz mit dem Internet. · Tipp: steht meist neben der Telefonbuchse
      - Switch → Macht aus einem Netzwerkanschluss viele.
    regeln:
      - "`- Vorderseite → Rückseite · Bild: datei.png · Tipp: …`; `modus` normal (Standard) oder repetition."
  - typ: Geschichte
    formularname: Geschichte
    rolle: üben
    moodle: H5P Branching Scenario
    angaben: [start, bild, abschluss, website]
    kursdatei: "§3, §6"
    phasen: [Vertiefung, Anwendung]
    beispiel: |
      ### Geschichte: Morgen ist das Referat · 8 min
      start: Morgen ist das Referat | Entscheide dich
      Ende (hart): Harte Landung
      Der Laptop läuft wieder, nach einem Werksreset ohne Sicherung.
      Ende (gut): Gut gelöst
      Mit der genauen Beschreibung war der Fehler in zehn Minuten gefunden.
      Szene (start): Sonntag, 19:30 Uhr → q1
      Morgen, zweite Stunde: dein Referat. Der Laptop zeigt nur „Dein PC muss repariert werden.“
      Frage (q1): Was tust du zuerst?
      - Neu starten und hoffen. → hart
      - Aufschreiben, was genau passiert. → gut
    regeln:
      - "Szenen, Fragen und Enden tragen Schlüssel in Klammern; Ziele nach → sind Schlüssel; die erste Szene ist der Start."
      - "Erst ab etwa 90 Minuten Einheit sinnvoll."
  - typ: Lückentext
    formularname: Lückentext
    rolle: üben
    moodle: H5P Fill in the Blanks
    angaben: [aufgabe, abschluss, website]
    pflicht: [aufgabe]
    kursdatei: "§3, §5"
    phasen: [Übung, Üben in Stufen, Üben]
    mindest: {zahl: 5, einheit: Lücken}
    beispiel: |
      ### Lückentext: Der Weg des Signals · 3 min
      aufgabe: Setze die Geräte ein.
      Der *Router* verbindet das Heimnetz mit dem *Internet*. Der *Switch* macht aus einem Anschluss viele.
    regeln:
      - "`aufgabe:` ist Pflicht; Lücken als `*Lücke/Alternative:Tipp*`; Brüche nie als ganze Lücke."
  - typ: Umfrage
    formularname: Selbsteinschätzung
    rolle: rahmen
    moodle: Feedback
    angaben: [einleitung, danach, skala]
    kursdatei: "§3"
    phasen: [Hinführung, Selbstkontrolle, Reflexion]
    beispiel: |
      ### Umfrage: Wo stehst du? · 2 min
      einleitung: Schätze dich ehrlich ein.
      - Ich kann erklären, was ein Switch tut.
      - Was war am schwersten? → Begriffe | Kabel | Zuordnen
    regeln:
      - "`- Aussage` auf der Skala (Standard 1 bis 5) oder `- Frage → a | b | c`; unbewertet."
  - typ: Badge
    formularname: Abzeichen
    rolle: rahmen
    minuten: false
    moodle: Badge des Kurses
    angaben: [beschreibung, bild, voraussetzung]
    pflicht: [bild, voraussetzung]
    assets: [badge.png]
    kursdatei: "§3"
    phasen: [Sicherung, Probelauf]
    beispiel: |
      ### Quiz: Abschlussquiz · 5 min
      1. Was verbindet ein Netz? · ✔Geräte · Steckdosen
      ### Badge: Netzwerkprofi
      beschreibung: Du kennst die Geräte im Heimnetz.
      bild: badge.png
      voraussetzung: Abschlussquiz
    regeln:
      - "Nur Angaben, kein Element im Kurs; `voraussetzung` nennt Titel von Elementen mit Abschluss bestehen."
  - typ: Unterabschnitt
    formularname: Unterabschnitt
    rolle: rahmen
    minuten: false
    moodle: Unterabschnitt (subsection)
    angaben: [teil]
    kursdatei: "§1"
    phasen: []
    beispiel: |
      ### Unterabschnitt: Lerneinheit 1
      teil: le1
      #### Textfeld: Einstieg
      Ein Satz zum Einstieg.
    regeln:
      - "Nur direkt im Abschnitt; seine Elemente haben vier Rauten."
  - typ: Test
    formularname: Test (bewertet)
    rolle: sichern
    moodle: Test (quiz) mit Fragensammlung
    angaben: [bestehen, einleitung, versuche, mischen, rückmeldung, je seite, abschluss]
    kursdatei: "§5a"
    phasen: [Sicherung, Probelauf]
    beispiel: |
      ### Test: Abschlusstest · 8 min
      bestehen: 75 %
      versuche: 2
      rückmeldung: sofort
      1. Welches Gerät verbindet das Heimnetz mit dem Internet? · ✔Router · Switch · Drucker
      2. RF: Ein Switch verteilt Funk. ✘ → richtig: Stimmt, das macht der Access Point. → falsch: Nein, Funk kommt vom Access Point.
      3. Kurzantwort: Wie heißt das Kabel im Heimnetz? · Netzwerkkabel · LAN-Kabel · Ethernetkabel
    regeln:
      - "Nur MC, RF und Kurzantwort; bewertet, erscheint im Bewertungsbuch; für Zwischenchecks Quiz nehmen."
  - typ: Aufgabe
    formularname: Aufgabe (Abgabe)
    rolle: sichern
    moodle: Aufgabe (assign)
    angaben: [abgabe, bewertung, bestehen, fällig, abschluss]
    kursdatei: "§3"
    phasen: [Sicherung, Anwendung]
    beispiel: |
      ### Aufgabe: Hefteintrag abgeben · 5 min
      abgabe: text, datei
      bewertung: 10
      fällig: 2026-12-01
      Fotografiere deinen Hefteintrag oder tippe ihn ab.
    regeln:
      - "Textbausteine sind die Aufgabenstellung; `abgabe` text (Standard), datei oder beides; `fällig` als JJJJ-MM-TT."
  - typ: Datei
    formularname: Datei
    rolle: lesen
    minuten: false
    moodle: Datei (resource)
    angaben: [datei, abschluss]
    pflicht: [datei]
    assets: [arbeitsblatt.pdf]
    kursdatei: "§3"
    phasen: [Lesen, Übung]
    beispiel: |
      ### Datei: Arbeitsblatt Heimnetz
      datei: arbeitsblatt.pdf
      Zum Ausdrucken für den Hefteintrag.
    regeln:
      - "`datei:` nennt eine Datei aus assets/ (PDF, Bild, Office); Textbausteine darunter sind die Beschreibung."
  - typ: Verzeichnis
    formularname: Dateiordner
    rolle: lesen
    minuten: false
    moodle: Verzeichnis (folder)
    angaben: [anzeige, abschluss]
    assets: [arbeitsblatt.pdf, checkliste.pdf]
    kursdatei: "§3"
    phasen: [Lesen]
    beispiel: |
      ### Verzeichnis: Material
      anzeige: eingebettet
      - arbeitsblatt.pdf
      - checkliste.pdf
    regeln:
      - "Liste `- name.pdf` mit Dateien aus assets/; `anzeige` seite (Standard) oder eingebettet."
  - typ: Forum
    formularname: Forum
    rolle: rahmen
    minuten: false
    moodle: Forum
    angaben: [typ, abschluss]
    kursdatei: "§3"
    phasen: [Reflexion]
    beispiel: |
      ### Forum: Fragen zur Einheit
      typ: frage-antwort
      Stelle hier deine Frage; antworte auf eine Frage einer anderen Person.
    regeln:
      - "`typ` allgemein (Standard), frage-antwort, je person, blog; `abschluss` keine (Standard), beitrag, ansehen."
  - typ: Buch
    formularname: Buch
    rolle: lesen
    moodle: Buch (book)
    angaben: [abschluss]
    assets: [schloss.png]
    kursdatei: "§6a"
    phasen: [Erarbeitung, Erinnern, Lesen]
    beispiel: |
      ### Buch: Was ein gutes Passwort ausmacht · 8 min
      Kapitel: Warum Passwörter wichtig sind
      Vorspann: Ein Passwort ist der Schlüssel zu deinen Daten.
      Kapitel: Länge schlägt Komplexität
      Bild: schloss.png | Vorhängeschloss
      Unterkapitel: Passphrasen
      Vier zufällige Wörter sind leichter zu merken als acht Zeichen Kauderwelsch.
    regeln:
      - "`Kapitel: Titel`, `Unterkapitel: Titel`, darunter Textbausteine und `Bild:`; ohne Fragen, druckbar."
  - typ: Abstimmung
    formularname: Abstimmung
    rolle: rahmen
    minuten: false
    moodle: Abstimmung (choice)
    angaben: [mehrfach, ergebnisse, ändern, abschluss]
    kursdatei: "§3"
    phasen: [Hinführung, Reflexion]
    beispiel: |
      ### Abstimmung: Welches Thema zuerst?
      mehrfach: nein
      ergebnisse: nach abgabe
      Stimme ab, was wir zuerst vertiefen.
      - Kabel
      - WLAN
    regeln:
      - "Textbausteine sind die Frage, Liste `- Option` (mindestens zwei); `ergebnisse` nie, nach abgabe, nach ende, immer."
  - typ: Glossar
    formularname: Glossar
    rolle: lesen
    minuten: false
    moodle: Glossar (glossary)
    angaben: [anzeige, abschluss]
    kursdatei: "§3"
    phasen: [Erinnern, Überblick]
    beispiel: |
      ### Glossar: Netzbegriffe
      anzeige: wörterbuch
      | Router | Verbindet das Heimnetz mit dem Internet. |
      | Switch | Macht aus einem Netzwerkanschluss viele. |
    regeln:
      - "`| Begriff | Erklärung | Alias |` oder `- Begriff → Erklärung`; Einträge kommen per XML-Import nach dem Wiederherstellen."

# Einheitsvorlagen (Phasenschemata, Anteile für 45 Minuten). `dehnbar`: wächst bei mehr als 45 Minuten, die anderen Phasen
# bleiben bei ihren 45-Minuten-Werten. `bausteine`: Typ oder „Typ: Titel“ (ohne Titel = Phasenname), optional mit
# „ | Teilschritt“ (seit AP12a): der Teilschritt steht im Text für den Chat an diesem Baustein, nicht auf der Karte.
# `rolle` wie oben.
vorlagen:
  # AP13 (Befund des Autors 24.10.): minimal, höchstens sechs Karten, eine je Phase (Übung zwei). Phasen sind das
  # Denkraster der Lehrkraft, nicht die Bausteinliste. „automatisch: Titel“ = das Modell wählt den Typ aus Titel,
  # Teilschritt und Auftrag (Liste `automatisch` unten); ein fester Typ nur, wo die Phase ihn vorgibt (Einstieg = Text,
  # Hefteintrag = Seite, Probelauf = Test). `zusammen`: Phasen der Phasenschemata, die eine Karte zusammenfasst (Anteil =
  # Summe). Der Teilschritt nach „ | “ steht nur im Text für den Chat. `optional: true` =
  # Karte ist da, aber ausgeschaltet (nicht im Text, nicht in den Minuten), bis die Lehrkraft sie einschaltet.
  - name: Einführung
    zeile: neues Thema
    phasen:
      - {phase: Einstieg, anteil: 17, rolle: einstieg, zusammen: [Einstieg, Hinführung, Zielangabe], bausteine: ["Textfeld: Einstieg | Ein Text: Fall oder Frage aus dem Alltag, Hinführung zum Thema und das Ziel der Stunde in einem Satz."]}
      - phase: Erarbeitung
        anteil: 35
        rolle: lesen
        dehnbar: true
        bausteine:
          - "automatisch: Lesetext mit Fragen | Aufbau dieser einen Seite: neue Begriffe einführen, jeden an einer Skizze oder einem Beispiel; die Begriffe an Beispielen benennen lassen (Fragen dazwischen); dann die Regel oder den Satz herleiten, im Merke-Kasten festhalten und an zwei durchgerechneten Beispielen mit Zwischenschritten zeigen."
      - {phase: Übung, anteil: 30, rolle: üben, dehnbar: true, bausteine: ["automatisch: Übung zum Zuordnen | Die Regel an leichten Fällen erkennen.", "automatisch: Übung mit Eingabe | Die Regel anwenden, mit Eingabe und einem Fall; ein Ergebnis geht nicht auf und wird gerundet."]}
      - {phase: Sicherung, anteil: 13, rolle: sichern, bausteine: ["Seite: Hefteintrag | Hefteintrag zum Abschreiben: Begriffe, Regel, ein Beispiel."]}
      - {phase: Vertiefung, anteil: 5, rolle: sichern, optional: true, bausteine: ["automatisch: Der Fall vom Anfang | Den Fall aus dem Einstieg mit der Regel lösen."]}
  - name: Übung und Vertiefung
    zeile: Thema ist bekannt
    phasen:
      - {phase: Aufwärmen, anteil: 10, rolle: einstieg, bausteine: ["automatisch: Aufwärmen | Kurze Aufgaben zum Vorwissen."]}
      - {phase: Kurz erinnern, anteil: 10, rolle: lesen, bausteine: ["automatisch: Kurz erinnern | Regel und ein Beispiel in wenigen Sätzen."]}
      - {phase: Üben in Stufen, anteil: 55, rolle: üben, dehnbar: true, bausteine: ["automatisch: Stufe 1 | Erkennen, leichte Fälle.", "automatisch: Stufe 2 | Anwenden auf Fälle, mit Eingabe."]}
      - {phase: Selbstkontrolle, anteil: 15, rolle: sichern, bausteine: ["automatisch: Selbstkontrolle | Gemischte Aufgaben mit Lösung."]}
      - {phase: Vertiefung, anteil: 10, rolle: sichern, optional: true, bausteine: ["automatisch: Neuer Fall | Ein Fall, der vorher nicht vorkam."]}
  - name: Wiederholung und Prüfungsvorbereitung
    zeile: Fragenkatalog oder Stoffliste liegt vor
    phasen:
      - {phase: Überblick, anteil: 5, rolle: rahmen, bausteine: ["Textfeld: Was geprüft wird"]}
      - {phase: Erinnern, anteil: 25, rolle: lesen, dehnbar: true, bausteine: ["automatisch: Erinnern | Das Wichtigste je Teilthema knapp."]}
      - {phase: Üben nach Teilthemen, anteil: 45, rolle: üben, dehnbar: true, bausteine: ["automatisch: Teilthemen üben | Aufgaben je Teilthema."]}
      - {phase: Probelauf, anteil: 20, rolle: sichern, bausteine: ["Test: Probelauf"]}
      - {phase: Reflexion, anteil: 5, rolle: sichern, optional: true, bausteine: ["Umfrage: Was noch unsicher ist"]}
  - name: Einheit aus eigenem Material
    zeile: Folien, Heftbilder, Arbeitsblatt
    phasen:
      - {phase: Einstieg, anteil: 10, rolle: einstieg, bausteine: ["Textfeld: Einstieg"]}
      - {phase: Lesen, anteil: 35, rolle: lesen, dehnbar: true, bausteine: ["automatisch: Lesetext aus deinem Material"]}
      - {phase: Üben, anteil: 30, rolle: üben, dehnbar: true, bausteine: ["automatisch: Übung 1", "automatisch: Übung 2"]}
      - {phase: Sichern, anteil: 20, rolle: sichern, bausteine: ["Seite: Hefteintrag"]}
      - {phase: Anwendung, anteil: 5, rolle: sichern, optional: true, bausteine: ["automatisch: Anwendung"]}

# Typ „automatisch“ (AP13): Standard jeder neuen Karte. Der Text für den Chat nennt diese Typen mit je einer Zeile, das
# Modell wählt; nennt ein Auftrag zwei Dinge („Sachtext mit Quiz“), gibt es zwei Bausteine aus. Sechs Typen (Entscheidung
# 24.10.2026, 13:30); jeder bringt sein Formatbeispiel mit, die Grenze für den Text liegt deshalb bei 12 KB
# (gen/prompt.py GRENZE). Seltene Typen wählt die Lehrkraft an der Karte.
automatisch:
  typen:
    Textfeld: "kurzer Text direkt auf der Kursseite: Fall, Frage, Merksatz"
    Seite: "Lesetext auf eigener Seite mit Zwischenüberschriften, Kästen und Bild; Fragen dazu im Quiz danach"
    Quiz: "Übungsfragen mit Rückmeldung (Auswahl, richtig/falsch, Eingabe)"
    Zuordnen: "Begriffe oder Fälle in Gruppen sortieren"
    Lernkarten: "Begriff vorn, Erklärung hinten, zum Wiederholen"
    Lückentext: "Text mit Lücken zum Einsetzen von Fachbegriffen oder Zahlen"

# Typ-Auswahl an der Karte (AP13): Gruppen nach Rolle, je Gruppe der häufigste Typ oben; Typen, die keine Gruppe nennt,
