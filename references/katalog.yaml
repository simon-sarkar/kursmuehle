# Sätze für den Text für den Chat (gen/prompt.py). Der Text richtet sich an das Modell; „Codeblock“ darf hier stehen.
prompt:
  einheit: >-
    Schreibe eine Unterrichtseinheit als Kursdatei für die ByCS-Lernplattform. Du schreibst nur den Inhalt im Format
    unten; eine Webseite baut daraus den Kurs. Stell keine Rückfragen. Was an der Form nicht vorgegeben ist, entscheidest
    du selbst und schreibst es als Zeile `Angenommen: …` in den Kopf.
  baustein: >-
    Schreibe einen Baustein einer Kursdatei für die ByCS-Lernplattform neu. Stell keine Rückfragen. Gib nur diesen
    Baustein aus, im Format unten.
  lernende: "Sprich die Lernenden mit du an. Personen, Firmen und Marken in Fällen sind erfunden."
  textbausteine: >-
    Textbausteine je Zeile: Absatz (Leerzeile trennt), `Vorspann: …`, `Überschrift: …`, `Hervorhebung: …`, `- Punkt`,
    `Schritte: Titel` mit `1. …`, `| Begriff | Erklärung |`, `Merke: …`; `Kasten: Titel`, `Beispiel: Titel` und
    `Hinweis: Titel` stehen allein in der Zeile, ihr Inhalt folgt darunter um zwei Leerzeichen eingerückt (nie Text
    direkt nach dem Titel); `Bild: datei.png | Alt-Text | Unterschrift`. Formeln als Text mit
    ², ³, √, ·, kein LaTeX.
  fragen: >-
    Fragen je Zeile: `MC: Frage? · A · ✔B · C` (✔ = richtig) oder `MC: Frage?` mit Zeilen `- ✔ Antwort → Rückmeldung`
    und `- Antwort → Rückmeldung`; `RF: Aussage ✔` oder `✘`, dahinter `→ richtig: …` und `→ falsch: …`;
    `Einsetzen: Aufgabe` mit Text darunter, Lücken als `*Wort*` (auch Zahlen: `*2,5*`). Antworten enthalten kein ` · `.
  fragen_test: >-
    Im Test nur MC, RF und `Kurzantwort: Frage · Lösung · andere Schreibweise`; Kurzantwort gibt es nur im Test.
  leitplanken:
    - "Die Einheit beginnt mit einem Fall oder einer Frage aus dem Alltag der Lernenden; ein Lesebaustein danach löst sie auf."
    - "Keine Aufgabe verwendet etwas, das erst später in der Einheit eingeführt wird; prüfe jede Aufgabe gegen die Bausteine davor. Der Einstieg fragt nach Vermutungen, nicht nach der Regel."
    - "Halte die Teilschritte und die Länge je Baustein ein (Wortziel, Zahl der Aufgaben); ein Lesetext für 15 Minuten ist kein Absatz, sondern eine Folge kurzer Abschnitte mit Zwischenüberschriften."
    - "Zu jedem Verfahren zwei durchgerechnete Beispiele mit allen Zwischenschritten."
    - "Erst Lesen, dann Üben, dann Sichern; die Übungen steigen an: erst erkennen, dann auf einen Fall anwenden."
    - "Höchstens die Hälfte aller Fragen der Einheit ist Multiple Choice. Zähle MC gegen alle Fragen (RF, Einsetzen, Lückentext und Kurzantwort zählen als andere)."
    - "Die Mehrheit der Fragen in Quiz und Test schildert eine Situation, in der etwas zu entscheiden oder zu rechnen ist; zähle sie."
    - "In Übungen (Quiz zwischendurch, Fragen im Lesebuch) bekommt jede falsche Antwort, die eine Fehlvorstellung abbildet, eine Rückmeldung mit →: was falsch ist und warum. Zähle je Übungsfrage mindestens eine."
    - "Nur wenn die Einheit Rechenaufgaben hat: mindestens eine Aufgabe, deren Ergebnis nicht aufgeht, mit Rundungsanweisung (etwa „runde auf eine Stelle nach dem Komma“)."
    - "Ein Bild nur, wo der Inhalt eine Fachgrafik braucht (Figur, Skizze, Diagramm), höchstens eins je Lesebaustein. Jede Zeile `Bild:` hat einen Alt-Text; zähle Bilder und Alt-Texte, die Zahlen sind gleich."
    - "Die Sicherung am Ende enthält mindestens einen Fall, der vorher nicht vorkam."
  checkliste:
    - "Keine Dreierreihen um des Klangs willen, keine Doppelpunkt-Pointen im Fließtext („Das Ergebnis: …“)."
    - "Keine rhetorischen Fragen ohne Aufgabe oder Antwort danach."
    - "Rückmeldungen nennen den Grund; kein bloßes „Super“ oder „Genau richtig“."
    - "Falsche Antworten kommen aus Fehlvorstellungen zum Thema und sind etwa so lang wie die richtige."
    - "Keine Ausrufezeichen, keine Emojis, kein Genderzeichen (Doppelform oder neutral: Lernende)."
    - "Keine Zeilen über Zweck oder Quelle im Kurs („Hier übst du …“, „Ziel: …“); Untertitel nennen nicht die Dauer."
    - "Überschriften sagen, worum es geht; keine Floskeln wie „Los geht’s“ oder „Spannende Fakten“."
    - "Kein „immer“, „nie“, „alle“, wenn es Ausnahmen gibt; keine Werbesprache („spannend“, „entdecke“)."
    - "Arbeitsaufträge als ein Satz oder als Stichzeilen; kein Absatz über 60 Wörter."
    - "Keine Schlussformeln wie „Viel Erfolg“."
  # Bild-Pflicht je Fach (AP12a): Fach aus der Liste oder ein Stichwort im Thema -> die Regel `skizze` kommt dazu
  skizze_faecher: [Mathematik, Physik, Chemie, Technik, Erdkunde, Geographie]
  skizze_stichworte: [Geometrie, Dreieck, Viereck, Kreis, Winkel, Pythagoras, Bruch, Brüche, Diagramm, Graph, Funktion,
    Koordinat, Schaltung, Stromkreis, Karte, Maßstab, Körper, Fläche, Volumen]
  skizze: >-
    Bild Pflicht: Einstieg und jeder Erarbeitungsbaustein haben ein Bild (Skizze mit Beschriftung) mit Alt-Text; im Kopf
    stehen dazu je Bild die Zeilen `Bildwunsch:` und `Bildprompt:`. Auf das Bild bezieht sich der Text.
  wortziel_text: "Lesetext für {min}, etwa {woerter} Wörter"
  wortziel_einstieg: "Fall mit einer Denkaufgabe im Kasten für {min}, etwa {woerter} Wörter"
  wortziel_heft: "Hefteintrag zum Abschreiben für {min}, etwa {woerter} Wörter"
  wortziel_kurz: "ein bis drei Sätze"
  wortziel_aufgaben: "{n} für {min}"
  wortziel_elemente: "etwa {n} Elemente"
  bilder: >-
    Bilder: Schreib im Baustein `Bild: name.png | Alt-Text` und in den Kopf je Bild zwei Zeilen: `Bildwunsch: name.png |
    ein Satz, was zu sehen ist` (zum Suchen eines freien Bildes oder zum Zeichnen) und darunter `Bildprompt: name.png |
    ausführlicher Auftrag für einen Bildgenerator` (Motiv, Stil, Seitenverhältnis; Text im Bild nur für nötige
    Beschriftungen wie Achsen oder Größen, jeweils wörtlich angegeben). Die Lehrkraft besorgt das Bild.
  bilder_erzeugen: >-
    Bilder: Schreib im Baustein `Bild: name.png | Alt-Text` und in den Kopf je Bild zwei Zeilen: `Bildwunsch: name.png |
    ein Satz, was zu sehen ist` und darunter `Bildprompt: name.png | ausführlicher Auftrag für einen Bildgenerator`
    (Motiv, Stil, Seitenverhältnis; Text im Bild nur für nötige Beschriftungen wie Achsen oder Größen, jeweils wörtlich
    angegeben). Erzeuge die Bilder im Anschluss an die Kursdatei in einer eigenen Nachricht, jedes mit seinem Dateinamen.
  ausgabe_codeblock: >-
    Ausgabe: die ganze Kursdatei als ein einziger Codeblock (```markdown am Anfang, ``` am Ende), ohne Text davor oder
    danach.
  ausgabe_text: "Ausgabe: die ganze Kursdatei als reiner Text, ohne Text davor oder danach."
  ausgabe_ids: >-
    Jeder Baustein beginnt mit `### Typ: Titel · N min`, in der Zeile darunter steht `id:` genau wie in der Liste. Gib
    alle Bausteine der Liste aus, in dieser Reihenfolge. Zusätzliche Bausteine nur, wenn ein Auftrag zwei verlangt oder
    die Minuten sonst nicht gefüllt sind (Regeln zu zwei Bausteinen und zur Zeit oben).
  automatisch: >-
    Bei „Typ frei“ und bei Bausteinen, die du ergänzt, wählst du den Typ, der zu Arbeitstitel, Teilschritt und Auftrag
    passt, aus diesen:
  automatisch_zwei: >-
    Nennt ein Auftrag zwei Dinge (etwa „Sachtext mit Quiz“), gib zwei Bausteine aus; der zweite trägt die id mit -2
    (aus b3 wird b3-2).
  zeit_frei: >-
    Zeit: Verteile die {minuten} Minuten selbst auf die Bausteine und schreib die Minuten in jede Überschrift. Richtwerte
    für diese Jahrgangsstufe: Lesetext zum Erarbeiten etwa {lesen} Wörter je Minute, Einstieg etwa {einstieg},
    Hefteintrag zum Abschreiben etwa {heft}; eine Aufgabe {einfach} Minuten, mit Rechnung {rechnen}.
  # Zählregeln (AP13.1, Lauf „Das Auge“ mit ByLKI): Zeit nie wegerklären, Mindestmaße je Baustein, Einstieg kurz,
  # Denkaufgaben sind keine Übung. Zahlen aus `pruefregeln` und `mindest` je Typ.
  zeit: >-
    Die Bausteine füllen die {minuten} Minuten; die Minuten in den Überschriften ergeben zusammen {minuten}.
    `Angenommen:` gilt nur für die Form (Kursformat, Designvorlage, Darstellung, Abschluss, Portionierung); nimm nie
    Zeit außerhalb des Kurses an (Unterrichtsgespräch, Hausaufgabe, Folgestunde). Reichen die Bausteine der Liste nicht
    für die Minuten, ergänze Bausteine in der Phasenfolge Einstieg, Erarbeitung, Übung, Sicherung, Typ nach eigener
    Wahl; ein ergänzter Baustein trägt die id des Bausteins davor mit -2, ein weiterer dahinter -3 (aus b1 wird b1-2,
    dann b1-3). Für ergänzte Bausteine schreibst du keine Zeile `Angenommen:`.
  mindest: "Mindestmaße je Baustein (zähle nach): {liste}."
  mindest_typ: "{typ} mindestens {zahl} {einheit}"
  mindest_hefteintrag: "Hefteintrag mindestens {zahl} Wörter mit Zeilen `Merke: …`, Fachbegriffe **fett**"
  einstieg: >-
    Der Einstieg hat höchstens {woerter} Wörter und nimmt die Erarbeitung nicht vorweg; der lange Teil ist die
    Erarbeitung.
  uebung: >-
    Ein Kasten mit Fragen in einem Lesetext (Textfeld, Seite) ist keine Übung; als Übung zählen nur {typen}.
  korrektur_zeit: >-
    Fülle die {minuten} Minuten mit Bausteinen; nimm keine Zeit außerhalb des Kurses an. Gib die Kursdatei im selben
    Format noch einmal aus, ohne diese `Angenommen:`-Zeile.
  teil: >-
    Das ist Teil {n} von {von}. Gib nur die Bausteine dieses Teils aus; {weiter}
  teil_weiter: "der nächste Teil folgt in einer eigenen Nachricht."
  teil_letzter: "die anderen Teile hast du schon geschrieben."
  korrektur: >-
    Im Baustein „{titel}“ (id: {id}) meldet die Prüfung{zeile}: {text}. Gib nur diesen Baustein im selben Format noch
    einmal aus, mit der Zeile `id: {id}`.
  fachcheck: >-
    Löse die folgenden Aufgaben selbst. Nenne nur Nummer und Lösung, eine Zeile je Aufgabe, ohne Erklärung: bei Auswahl
    die Buchstaben (3: B oder 3: A, C), bei richtig oder falsch das Wort (4: falsch), bei Lücken die Wörter der Reihe
    nach mit Semikolon (5: Router; Switch), bei Zuordnungen die Gruppe, bei Kurzantworten die Antwort.

# Zeitbedarf aus dem Inhalt (gen/mappe.py, seit AP12a nach Rolle). Anker des Autors für Jahrgangsstufe 9 Mittelschule:
# Erarbeitung eines neuen Inhalts etwa 60 Wörter je Minute effektiv (dichtes Fachlesen, Beispiel nachrechnen), Einstieg
# und Hinführung etwa 120, Hefteintrag abschreiben etwa 10, Übung je Aufgabe 1,5 bis 3 Minuten nach Rechenaufwand statt
# je Wort. `woerter_je_minute` gilt je Rolle (Phase aus der Vorlage vor Rolle des Typs) für Jahrgangsstufe 9;
# `jahrgang_faktor` skaliert für andere Stufen (ab der genannten Stufe). Aufgaben (MC, RF, Einsetzen, Markieren,
# Lückentext, Kurzantwort, Zuordnen als Ganzes) zählen `aufgabe_minuten`, „rechnen“, wenn ihr Text einen Rechenausdruck
# (`rechnen_muster`) enthält; ihre Wörter zählen nicht noch einmal. Dazu Sekunden je Lernkarte, Aussage, Szene und Bild.
# Ein Baustein, der „Hefteintrag“ heißt oder etwas „ins Heft“ übernehmen oder übertragen lässt, zählt seine Wörter mit
# `abschreiben`. Ein `Kasten:` mit einer Frage (Denkaufgabe im Einstieg) zählt als eine einfache Aufgabe. Weicht die Rechnung um mehr als `abweichung` Prozent und mindestens eine Minute vom Soll ab (sonst von der
# Angabe in der Überschrift), sagt der Hinweis an der Karte, was fehlt („Erarbeitung für 4 Minuten statt 15“).
# `ohne_rechnung`: Typen, deren Zeit der Inhalt nicht zeigt (Video, Link, Abgabe); dort gilt die Angabe.
zeitbedarf:
  woerter_je_minute: {einstieg: 120, lesen: 60, üben: 60, sichern: 60, rahmen: 120}
  jahrgang_faktor: {1: 0.45, 3: 0.6, 5: 0.75, 7: 0.9, 9: 1.0, 11: 1.15}
  abschreiben: 10
  aufgabe_minuten: {einfach: 1.5, rechnen: 3}
  # Rechenausdruck, Wurzel oder Potenz, Rechenverb, oder zwei Größen mit Einheit in einer Aufgabe
  rechnen_muster: "\\d\\s*[-+−·×*/:=]\\s*\\d|[²³√]|\\b(?:[Bb]erechne|[Rr]echne|[Rr]unde)|(?:\\d+(?:,\\d+)?\\s*(?:mm|cm|dm|km|m|kg|g|t|l|ml|€|%|°|min|h|s)\\b.*){2}"
  sekunden: {luecke: 10, zuordnung: 20, karte: 15, aussage: 30, umfrage: 10, szene: 20, bild: 15}
  abweichung: 20
  ohne_rechnung: [Video, Link, Aufgabe]
  # Richtwert je Karte nach Rolle (AP13.1): höchstens so viele Minuten trägt eine Karte. Ist die Summe der eingeschalteten
  # Karten kleiner als die Minuten der Einheit, warnt die Seite vor dem Kopieren („2 Karten für 45 Minuten“).
  karte_minuten: {einstieg: 10, lesen: 30, üben: 20, sichern: 15, rahmen: 5}

# Prüfregeln der Mühle (AP13.1, gen/api.py einheit_pruefen), gelten für Einheiten, deren Text für den Chat kopiert wurde:
# Typen, die als Übung zählen (ein Kasten mit Fragen im Lesetext zählt nicht), Wortgrenze des Einstiegs (darüber ein gelber
# Hinweis, kein Fehler), Warnung je Rolle, wenn keine eingeschaltete Karte der Einheit sie mehr trägt (nur Rollen, die die
# Vorlage der Einheit hat; Warnung, keine Sperre).
pruefregeln:
  uebung: [Quiz, Zuordnen, Lückentext, Lernkarten, Test]
  einstieg_woerter: 100
  fehlt: {einstieg: Kein Einstieg mehr, lesen: Keine Erarbeitung mehr, üben: Keine Übung mehr, sichern: Keine Sicherung mehr}
