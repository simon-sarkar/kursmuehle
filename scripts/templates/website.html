<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITEL}}</title>
<!-- Kursmühle, Website-Modus (scripts/gen/website.py). Ohne externe Quellen; Übungen ohne Bewertung. -->
<style>
:root{--hue:{{HUE}};--tint:{{TINT}};--ink:{{INK}};--muted:{{MUTED}};--line:{{LINE}};--r:{{R}};--ok:#15803D;--okbg:#ECFDF3;--bad:#B42318;--badbg:#FEF3F2;--bg:#F6F7F9}
*{box-sizing:border-box}
html{scroll-padding-top:64px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
img{max-width:100%;height:auto}
a{color:var(--hue)}
.km-top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;height:56px;padding:0 16px;background:#fff;border-bottom:1px solid var(--line)}
.km-top b{flex:1;min-width:0;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.km-prog{position:absolute;left:0;right:0;bottom:-1px;height:3px;background:transparent}
.km-prog span{display:block;height:100%;width:0;background:var(--hue);transition:width .3s}
.km-count{font-size:13px;color:var(--muted);white-space:nowrap}
.km-menu{display:none;border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 12px;font:inherit;font-size:14px;color:var(--ink);cursor:pointer}
.km-wrap{display:flex;max-width:1180px;margin:0 auto}
.km-nav{flex:0 0 280px;position:sticky;top:56px;align-self:flex-start;max-height:calc(100vh - 56px);overflow:auto;padding:20px 12px 40px 16px}
.km-nav a{display:flex;gap:10px;align-items:flex-start;padding:7px 10px;border-radius:8px;color:var(--ink);text-decoration:none;font-size:14.5px;line-height:1.35}
.km-nav a:hover{background:#fff}
.km-nav a[aria-current]{background:var(--tint);font-weight:600}
.km-grp{margin:16px 10px 4px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.km-dot{flex:none;width:10px;height:10px;margin-top:5px;border-radius:50%;border:2px solid var(--line);background:#fff}
.is-seen .km-dot,.km-tile.is-seen .km-dot{background:var(--hue);border-color:var(--hue)}
main{flex:1;min-width:0;padding:24px 16px 64px}
.km-ch{max-width:760px;margin:0 auto;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:28px 32px}
.km-ch>h1{font-size:1.75em;line-height:1.2;margin:4px 0 14px}
.km-hero{border-radius:var(--r);overflow:hidden;margin:-8px -12px 18px;background:var(--hue);color:#fff}
.km-hero-img{display:block;width:100%}
.km-hero-text{padding:22px 24px}
.km-hero-pic .km-hero-text{background:var(--tint);color:var(--ink);border-left:6px solid var(--hue)}
.km-hero h1{margin:0;font-size:1.8em;line-height:1.15;overflow-wrap:break-word;hyphens:auto}
.km-ch>h1,.km-tile-t{overflow-wrap:break-word;hyphens:auto}
.km-hero p{margin:8px 0 0;opacity:.9}
.km-grp-h{font-size:1.05em;margin:24px 0 10px}
.km-tiles{display:grid;gap:8px}
.km-tile{display:flex;align-items:center;gap:14px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;color:var(--ink);text-decoration:none}
.km-tile:hover{border-color:var(--hue)}
.km-num{flex:none;width:30px;height:30px;border-radius:50%;background:var(--tint);color:var(--hue);font-weight:700;display:flex;align-items:center;justify-content:center;font-size:14px}
.km-tile-t{flex:1;font-weight:600;line-height:1.3}
.km-tile-t small{display:block;font-weight:400;color:var(--muted);font-size:13px;margin-top:2px}
.km-pager{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:28px;padding-top:18px;border-top:1px solid var(--line)}
{{UEBUNGEN_CSS}}
.km-video{position:relative;padding-top:56.25%;border-radius:10px;overflow:hidden;background:#000}
.km-video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
@media (max-width:899px){
  .km-menu{display:inline-block}
  .km-nav{position:fixed;top:56px;left:0;right:0;bottom:0;max-height:none;background:#fff;z-index:15;display:none;padding:12px 16px 40px}
  body.km-open .km-nav{display:block}
  body.km-open{overflow:hidden}
  main{padding:12px 0 48px}
  .km-ch{border-radius:0;border-left:0;border-right:0;padding:20px 16px}
  .km-hero{margin:-4px 0 16px}
  .km-ch>h1{font-size:1.45em}
  .km-hero h1{font-size:1.45em}
  .km-hero-text{padding:16px 18px}
}
@media print{.km-top,.km-nav,.km-pager,.km-act{display:none}.km-ch[hidden]{display:block}.km-ch{border:0}}
</style>
</head>
<body>
<header class="km-top">
  <button type="button" class="km-menu" aria-expanded="false" aria-controls="km-nav">Inhalt</button>
  <b>{{NAME}}</b>
  <span class="km-count"></span>
  <div class="km-prog"><span></span></div>
</header>
<div class="km-wrap">
<nav class="km-nav" id="km-nav" aria-label="Kapitel">{{NAV}}</nav>
<main id="km-main">{{MAIN}}</main>
</div>
<script>
(function () {
  "use strict";
  var KEY = "{{SCHLUESSEL}}", IMG = {{BILDER}};
  var R = document;
{{UEBUNGEN_JS}}

  // Fortschritt: besuchte Kapitel im Browser merken (ohne Speicher geht es auch)
  var seen = {};
  try { seen = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) { seen = {}; }
  var chapters = all(".km-ch").map(function (s) { return s.id; }).filter(function (id) { return id !== "start"; });
  function save() { try { localStorage.setItem(KEY, JSON.stringify(seen)); } catch (e) {} }
  function progress() {
    var k = chapters.filter(function (id) { return seen[id]; }).length;
    one(".km-prog span").style.width = (chapters.length ? 100 * k / chapters.length : 0) + "%";
    one(".km-count").textContent = k + " / " + chapters.length;
    all("[data-k]").forEach(function (a) { a.classList.toggle("is-seen", !!seen[a.getAttribute("data-k")]); });
  }
  function show() {
    var id = (location.hash || "#start").slice(1);
    if (!document.getElementById(id) || !document.getElementById(id).classList.contains("km-ch")) id = "start";
    all(".km-ch").forEach(function (s) { s.hidden = s.id !== id; });
    all(".km-nav a").forEach(function (a) {
      if (a.getAttribute("data-k") === id) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
    });
    if (id !== "start") { seen[id] = 1; save(); }
    progress();
    document.body.classList.remove("km-open");
    one(".km-menu").setAttribute("aria-expanded", "false");
    window.scrollTo(0, 0);
  }
  window.addEventListener("hashchange", show);
  one(".km-menu").addEventListener("click", function () {
    var open = document.body.classList.toggle("km-open");
    this.setAttribute("aria-expanded", open ? "true" : "false");
  });
  show();
})();
</script>
</body>
</html>
